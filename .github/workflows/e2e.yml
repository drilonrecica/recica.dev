name: Browser and accessibility

on:
  pull_request:
    paths:
      - "recica/**"
      - "tools/**"
      - "labs/**"
      - ".node-version"
      - "Makefile"
      - "AGENTS.md"
      - "scripts/**"
      - ".github/**"
  push:
    branches: [master]
    paths:
      - "recica/**"
      - "tools/**"
      - "labs/**"
      - ".node-version"
      - "Makefile"
      - "AGENTS.md"
      - "scripts/**"
      - ".github/**"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: ${{ matrix.app }} Chromium E2E
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [recica, tools, labs]
    env:
      PUBLIC_INDEXING_ENABLED: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ${{ matrix.app }}/pnpm-lock.yaml
      - run: pnpm --dir ${{ matrix.app }} install --frozen-lockfile
      - run: pnpm --dir ${{ matrix.app }} exec playwright install --with-deps chromium
      - run: pnpm --dir ${{ matrix.app }} test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: ${{ matrix.app }}-playwright-failure
          path: |
            ${{ matrix.app }}/playwright-report
            ${{ matrix.app }}/test-results
          if-no-files-found: ignore
          retention-days: 7
